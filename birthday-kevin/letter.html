    <title>For Kevin · 余玺龙</title>

  <body class="letter-page">
    <main class="story" id="story" aria-label="给 Kevin 的生日祝福">
      <div class="story-stage">
        <div class="story-light" aria-hidden="true"></div>
        <div class="story-pages" id="storyPages">
          <section class="story-page page-intro" data-page="0">
            <div class="story-copy">
              <p>Dear Kevin,</p>
              <h1>生日快乐！</h1>
              <div class="scroll-hint" aria-hidden="true"><span></span><i></i></div>
            </div>
          </section>

          <section class="story-page" data-page="1">
            <p class="story-paragraph story-paragraph-medium">希望你收到贺卡的此刻，生活里的一切都顺遂。</p>
          </section>

          <section class="story-page" data-page="2">
            <p class="story-paragraph story-paragraph-long">想想已经近一年多未见了。尚未深涉世事的我可能还无法完全体会到新行业和新挑战的冷暖，但你的行动力和勇气一直是我appreciate并渴望学习的闪光点。</p>
          </section>

          <section class="story-page" data-page="3">
            <p class="story-paragraph story-paragraph-long">我微信的个性签名几年来一直是“功不唐捐，玉汝于成”。在现在的社会背景下这可能不是一句绝对的漂亮话，但我仍想致敬hard work eventually pays off的朴素信仰。</p>
          </section>

          <section class="story-page" data-page="4">
            <p class="story-paragraph story-paragraph-single">春山在望，胜意可期。</p>
          </section>

          <section class="story-page" data-page="5">
            <p class="story-paragraph story-paragraph-final">祝福你走的每一步都不落空，落地皆有回响，掷地而有声。</p>
          </section>

          <footer class="story-page page-signature" data-page="6">
            <div class="signature-copy">
              <p>Best regards，</p>
              <p>张艺韬</p>
              <a class="read-full" href="./full.html"><span>阅读全文</span><span aria-hidden="true">›</span></a>
            </div>
          </footer>
        </div>
        <div class="story-progress" aria-hidden="true"><span id="storyProgress"></span></div>
      </div>
    </main>
