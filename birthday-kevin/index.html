<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Happy Birthday, Kevin 余玺龙." />
    <title>Happy Birthday, Kevin · 余玺龙</title>
    <link rel="stylesheet" href="styles.css?v=20261110-2" />
  </head>
  <body class="is-locked">
    <canvas id="confetti" aria-hidden="true"></canvas>

    <main>
      <section class="opening" id="opening" aria-labelledby="openingTitle">
        <div class="opening-light opening-light-blue" aria-hidden="true"></div>
        <div class="opening-light opening-light-violet" aria-hidden="true"></div>
        <div class="opening-content">
          <h1 id="openingTitle">
            <span>Happy Birthday,</span>
            <strong>Kevin.</strong>
          </h1>
          <p>余玺龙</p>
          <button id="openLetter" type="button">
            <span>打开</span>
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </section>

      <article class="letter" id="letter" aria-label="给 Kevin 的生日祝福" inert>
        <section class="slide slide-intro tone-black align-center" data-motion="focus">
          <div class="slide-content intro-content">
            <p class="dear">Dear Kevin,</p>
            <h2>生日快乐！</h2>
          </div>
        </section>

        <section class="slide tone-light align-center" data-motion="lift">
          <div class="slide-content width-medium">
            <p class="message message-large">希望你收到贺卡的此刻，生活里的一切都顺遂。</p>
          </div>
        </section>

        <section class="slide tone-black align-left" data-motion="words">
          <div class="slide-content width-wide">
            <p class="message message-body">想想已经近一年多未见了。尚未深涉世事的我可能还无法完全体会到新行业和新挑战的冷暖，但你的行动力和勇气一直是我<span class="accent-word">appreciate</span>并渴望学习的闪光点。</p>
          </div>
        </section>

        <section class="slide tone-light align-left" data-motion="mask">
          <div class="slide-content width-wide">
            <p class="message message-body">我微信的个性签名几年来一直是“功不唐捐，玉汝于成”。在现在的社会背景下这可能不是一句绝对的漂亮话，但我仍想致敬<span class="accent-word">hard work eventually pays off</span>的朴素信仰。</p>
          </div>
        </section>

        <section class="slide tone-blue align-center" data-motion="scale">
          <div class="slide-glow" aria-hidden="true"></div>
          <div class="slide-content width-wide">
            <p class="message message-statement">春山在望，胜意可期。</p>
          </div>
        </section>

        <section class="slide tone-black align-left" data-motion="line">
          <div class="slide-content width-wide">
            <p class="message message-final">祝福你走的每一步都不落空，落地皆有回响，掷地而有声。</p>
          </div>
        </section>

        <footer class="slide tone-light align-center signature" data-motion="focus">
          <div class="slide-content signature-content">
            <p>Best regards，</p>
            <p>张艺韬</p>
          </div>
        </footer>
      </article>
    </main>

    <noscript>生日快乐，Kevin！请启用 JavaScript 查看完整的生日祝福。</noscript>
    <script src="script.js?v=20261110-2"></script>
  </body>
</html>
