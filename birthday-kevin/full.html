    <main class="full-letter">
      <article>
        <header>
          <p>Dear Kevin,</p>
          <h1>生日快乐！</h1>
        </header>

        <div class="full-letter-body">
          <p>希望你收到贺卡的此刻，生活里的一切都顺遂。</p>

          <p>想想已经近一年多未见了。尚未深涉世事的我可能还无法完全体会到新行业和新挑战的冷暖，但你的行动力和勇气一直是我appreciate并渴望学习的闪光点。</p>

          <p>我微信的个性签名几年来一直是“功不唐捐，玉汝于成”。在现在的社会背景下这可能不是一句绝对的漂亮话，但我仍想致敬hard work eventually pays off的朴素信仰。</p>

          <p>春山在望，胜意可期。</p>

          <p>祝福你走的每一步都不落空，落地皆有回响，掷地而有声。</p>
        </div>

        <footer class="full-signature">
          <p>Best regards，</p>
          <p>张艺韬</p>
        </footer>
      </article>
    </main>
  </body>
