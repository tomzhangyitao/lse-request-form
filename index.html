<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LSE 文献请求</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2933;
      --muted: #607080;
      --line: #d8dee6;
      --accent: #0b6bcb;
      --accent-dark: #084f96;
      --bg: #f7f9fb;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    main {
      width: min(760px, calc(100% - 32px));
      margin: 32px auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      letter-spacing: 0;
    }
    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 650;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }
    textarea {
      min-height: 180px;
      resize: vertical;
    }
    .hint {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    button, a.button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
    }
    button.secondary {
      background: #e8edf3;
      color: var(--ink);
    }
    button:hover, a.button:hover { background: var(--accent-dark); }
    button.secondary:hover { background: #dce4ed; }
    #preview {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #f1f5f9;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      color: #263443;
    }
  </style>
</head>
<body>
  <main>
    <h1>LSE 文献请求</h1>

    <label for="links">文章链接</label>
    <textarea id="links" placeholder="每行一个 DOI / 出版社链接 / press 链接"></textarea>
    <div class="hint">填完后点“用邮件发送”。如果手机没有反应，就点“复制邮件内容”，手动发到页面里显示的邮箱。</div>

    <div class="actions">
      <a id="mailLink" class="button" href="mailto:tomzhangyitao@gmail.com?subject=%5BLSE-PDF-REQUEST%5D&body=LINKS%3A%0A">用邮件发送</a>
      <button id="copyButton" class="secondary">复制邮件内容</button>
    </div>

    <div class="hint">收件人：tomzhangyitao@gmail.com<br>标题：[LSE-PDF-REQUEST]</div>
    <div id="preview"></div>
  </main>

  <script>
    const subject = "[LSE-PDF-REQUEST]";
    const ownerEmail = "tomzhangyitao@gmail.com";

    function buildBody() {
      const links = document.getElementById("links").value.trim();
      const body = [
        "LINKS:",
        links
      ].join("\n");
      document.getElementById("preview").textContent = "Subject: " + subject + "\n\n" + body;
      document.getElementById("mailLink").href = "mailto:" + ownerEmail +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);
      return body;
    }

    async function copyBody() {
      const body = "To: " + ownerEmail + "\nSubject: " + subject + "\n\n" + buildBody();
      await navigator.clipboard.writeText(body);
      document.getElementById("copyButton").textContent = "已复制";
      setTimeout(() => document.getElementById("copyButton").textContent = "复制邮件内容", 1200);
    }

    document.getElementById("copyButton").addEventListener("click", copyBody);
    document.getElementById("links").addEventListener("input", buildBody);
    buildBody();
  </script>
</body>
</html>
